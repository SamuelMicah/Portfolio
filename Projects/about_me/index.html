<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"
    />
    <!-- Font Inika -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inika&display=swap"
    />
    <!-- Styles CSS -->
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Content -->
    <div class="both-layout">
      <!-- Left Content -->
      <div class="p-card">
        <!-- Title -->
        <div
          class="p-title d-flex align-items-center justify-content-center py-3"
        >
          Certifications 🎓
        </div>

        <!-- Certifications -->
        <div
          class="d-flex flex-wrap justify-content-evenly align-items-center gap-3 pt-3 px-5"
          id="certifications-container"
        ></div>

        <!-- Skills Carousel -->
        <div
          id="skillsCarousel"
          class="carousel slide px-5 pt-5 pb-2"
          data-bs-ride="carousel"
        >
          <div class="carousel-inner" id="skills-track"></div>

          <div
            class="d-flex justify-content-center gap-3"
            id="carousel-indicators"
          ></div>
        </div>

        <!-- Buttons -->
        <div
          class="d-flex justify-content-evenly align-items-center gap-5 pt-3 pb-5"
        >
          <button class="btn p-btn-primary px-3" id="btn-download-cv">
            Download CV
          </button>
        </div>
      </div>

      <!-- Gap -->
      <div class=""></div>

      <!-- Right Content -->
      <div
        id="social-links"
        class="p-card d-flex flex-column justify-content-evenly align-items-center"
      ></div>
    </div>

    <!-- bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>

    <!-- Code -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
